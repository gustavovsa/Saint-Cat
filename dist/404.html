<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oops! Página não encontrada</title>
  <link href="/dist/output.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #ede9fe, #ddd6fe);
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    img { width: 250px; margin-bottom: 20px; }
    button {
      background-color: #7c3aed;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background-color: #6d28d9; }
  </style>
</head>
<body>
  <img src="assets/ErrorNotFound.png" alt="Oops" />
  <h1>Oops!</h1>
  <p>Parece que essa página não existe.</p>
  <button onclick="window.location.href='/'">Voltar ao início</button>
</body>
</html>
